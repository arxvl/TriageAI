name: CI

on:
  pull_request:
    branches: [develop, main]

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      db:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: triageai
          POSTGRES_PASSWORD: triageai_test
          POSTGRES_DB: triageai_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U triageai -d triageai_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DB_PASSWORD: triageai_test
      DB_APP_PASSWORD: triageai_app_test
      # The app (and therefore the tests) connect as the restricted role that
      # migration 0002 creates; Alembic connects as the owner.
      DATABASE_URL: postgresql+psycopg://triageai_app:triageai_app_test@localhost:5432/triageai_test
      MIGRATION_DATABASE_URL: postgresql+psycopg://triageai:triageai_test@localhost:5432/triageai_test
      TEST_DATABASE_URL: postgresql+psycopg://triageai_app:triageai_app_test@localhost:5432/triageai_test
      SECRET_KEY: ci-test-secret-key
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install backend
        run: pip install -e ".[dev]"

      - name: Ruff check
        run: ruff check .

      - name: Ruff format check
        run: ruff format --check .

      - name: Run tests
        run: pytest

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm run test

      - name: Build
        run: npm run build
