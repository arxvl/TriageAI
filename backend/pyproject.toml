[project]
name = "triageai-backend"
version = "0.0.1"
description = "TriageAI backend API: case intake, triage pipeline orchestration, and clinical decision support for veterinary clinics."
requires-python = ">=3.11"
dependencies = [
  "fastapi",
  "uvicorn[standard]",
  "pydantic",
  "pydantic-settings",
  "sqlalchemy>=2",
  "psycopg[binary]",
  "alembic",
  "argon2-cffi",
  "pyjwt",
  "httpx",
  "python-multipart",
  "pyyaml",
]

[project.optional-dependencies]
dev = ["pytest", "pytest-cov", "ruff"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]

[tool.pytest.ini_options]
testpaths = ["tests"]
