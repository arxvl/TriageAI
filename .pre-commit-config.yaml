repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    # Keep in step with the ruff in the backend image, or the hook and
    # `docker compose exec backend ruff check .` disagree.
    rev: v0.16.9
    hooks:
      - id: ruff-check # `ruff` is only a legacy alias in this rev
        args: [--fix]
        files: ^backend/
      - id: ruff-format
        files: ^backend/
        # backend/prompts/*.md is written by hand in M2/M3/M6b, and this rev's
        # ruff-format claims markdown too. Keep it to Python (CLAUDE.md §8).
        types_or: [python, pyi]

  - repo: https://github.com/pre-commit/mirrors-prettier
    rev: v3.1.0
    hooks:
      - id: prettier
        files: ^frontend/

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: end-of-file-fixer
      - id: trailing-whitespace
  - repo: local
    hooks:
      - id: strip-ai-trailers
        name: strip AI attribution trailers
        entry: bash scripts/strip-ai-trailers.sh
        language: system
        stages: [commit-msg]
