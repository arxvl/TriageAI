
name: triageai

services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: triageai
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: triageai
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U triageai -d triageai"]
      interval: 5s
      timeout: 5s
      retries: 10
    ports:
      - "5433:5432"

  backend:
    build:
      context: ./backend
      args:
        EMBEDDING_MODEL: ${EMBEDDING_MODEL:-sentence-transformers/all-MiniLM-L6-v2}
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./backend:/app
      - ./knowledge_base:/knowledge_base:ro
      - ./evaluation:/evaluation
    ports:
      - "8000:8000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - HF_HUB_OFFLINE=1
      - TRANSFORMERS_OFFLINE=1

  frontend:
    build: ./frontend
    env_file: .env
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports:
      - "5173:5173"

volumes:
  db_data:
