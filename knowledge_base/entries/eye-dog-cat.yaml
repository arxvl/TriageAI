slug: eye-dog-cat
title: "Eye problem – dogs and cats"
complaint_code: EYE
species: [DOG, CAT]
content: |
  What it is. Eye emergencies need a fast diagnosis. They include an eye pushed out of its socket by an injury (traumatic proptosis), bleeding in the eye, and foreign objects in the eye. Some conditions need immediate surgery to save the eye.

  Signs that raise urgency. An eye pushed out of its socket (proptosis) is Red. A deep penetrating eye injury or a sudden chemical injury to the eye is Red. Sudden complete loss of vision is Orange.

  Signs that usually allow waiting. The triage list does not give a Yellow or Green sign that is specific to the eye, so no waiting pattern is listed.

  What staff should ask the owner.
  - What happened to the eye, and when?
  - Does the eye look like it is bulging or pushed out?
  - Is the eye red, watering, or swollen?
  - Could something have got into the eye, such as a splinter, a plant spine, or a pellet?
  - Has your pet's vision seemed to change, for example bumping into things?
