slug: ear-dog-cat
title: "Ear problem – dogs and cats"
complaint_code: EAR
species: [DOG, CAT]
content: |
  What it is. Otitis externa is inflammation of the outer ear canal and is common in dogs and cats. It can come on suddenly or last a long time, and it can affect one ear or both. Young animals may be affected more often, and breed patterns often follow skin disease, such as allergies in retrievers and terriers.

  Signs that raise urgency. A pet in severe pain is Orange. A head tilt is Yellow. Moderate pain is Yellow. Severe itching is Yellow.

  Signs that usually allow waiting. Local redness or swelling in one area is Green. Recent mild pain or itching is Green.

  What staff should ask the owner.
  - Is one ear affected or both?
  - Did the ear problem start suddenly, or has it been going on or coming back for a while?
  - Does your pet have a history of skin problems or allergies?
  - Is there any discharge or smell coming from the ear?
  - Has your pet been tilting its head or losing its balance?
