slug: foreign-body-dog-cat
title: "Suspected swallowed object – dogs and cats"
complaint_code: FOREIGN_BODY
species: [DOG, CAT]
content: |
  What it is. A swallowed object (foreign body) can partly or fully block the digestive tract, which is an emergency. Large, round objects often cause a complete blockage, while thin, stringlike or small objects more often cause a partial one.

  Signs that raise urgency. A belly that swells up very quickly is Red. A pet that may have swallowed an object more than 24 hours ago and now has no appetite or is vomiting is Orange. A pet that may have swallowed an object, with no other warning signs, is Yellow. A pet that keeps vomiting again and again is Yellow. Black, tarry stool is Yellow.

  Signs that usually allow waiting. Vomiting on its own, without any of the signs above, is Green.

  What staff should ask the owner.
  - Did you see your pet swallow something, and if so, what was it?
  - How long ago do you think the object was swallowed?
  - Has your pet been vomiting, and is the vomiting continuing?
  - Is your pet eating normally, or has its appetite dropped?
