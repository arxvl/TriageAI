slug: dystocia-dog-cat
title: "Difficult birth – dogs and cats"
complaint_code: DYSTOCIA
species: [DOG, CAT]
content: |
  What it is. Dystocia is a difficult or unusually long birth. In dogs the most common cause is weak uterine contractions, but the cause can also lie with the mother or with the position or development of the puppies or kittens.

  Signs that raise urgency. Parts of a puppy or kitten showing at the birth opening are Red. A pet in shock is Red. Very heavy bleeding is Red. A pet that is in active labor is Orange. Abnormal vaginal bleeding in a pregnant pet is Yellow.

  Signs that usually allow waiting. The triage list does not give a lower category for this complaint, because a pet in active labor is already Orange.

  What staff should ask the owner.
  - When did labor start, and how long has she been straining?
  - When was she bred, and has the pregnancy gone past the expected due date?
  - How many babies have been born, and how long ago was the last one?
  - Is there any vaginal discharge, and is it bloody or an unusual color?
  - Is she a breed that often has birthing trouble, and has she had trouble before?
