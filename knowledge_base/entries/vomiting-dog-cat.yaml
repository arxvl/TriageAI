slug: vomiting-dog-cat
title: "Vomiting – dogs and cats"
complaint_code: VOMITING
species: [DOG, CAT]
content: |
  What it is. Vomiting is the forceful bringing up of stomach contents. A sudden start is typical of an inflamed stomach (acute gastritis), but vomiting can also come from swallowing something harmful or from illness elsewhere in the body.

  Signs that raise urgency. A belly that swells up very quickly is Red. Signs suggesting very low blood sugar are Red. A pet that may have swallowed a poison is Orange. A pet that may have swallowed an object more than 24 hours ago and now has no appetite or is vomiting is Orange. A pet that has lost a severe amount of body fluid (more than about 8 percent dehydrated) is Orange. A pet that keeps vomiting again and again is Yellow. A pet that may have swallowed an object recently is Yellow. Black, tarry stool is Yellow.

  Signs that usually allow waiting. Vomiting on its own, without any of the signs above, is Green.

  What staff should ask the owner.
  - When did the vomiting start, and did it begin suddenly?
  - How often is your pet vomiting, and is it food or yellow bile?
  - Could your pet have eaten something unusual, such as scraps, garbage, a toy, a poison, or a medicine?
  - Does your pet also seem to have belly pain, tiredness, or a poor appetite?
  - Does your pet have any other known illness?
